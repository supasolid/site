<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body {
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  button {
    background: black;
    color: white;
    border: 1px solid white;
    padding: 8px 12px;
    margin: 4px 4px 4px 0;
    cursor: pointer;
  }
  button:hover {
    background: white;
    color: black;
  }
  #muteBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
  }
  a {
    color: white;
  }
  input[type="text"] {
    background: black;
    color: white;
    border: 1px solid white;
    padding: 8px;
    margin: 8px 0;
    width: 100%;
    max-width: 300px;
    font-family: Arial, sans-serif;
  }
  select {
    background: black;
    color: white;
    border: 1px solid white;
    border-radius: 20px;
    padding: 8px 14px;
    margin: 8px 0;
    width: 100%;
    max-width: 300px;
    font-family: Arial, sans-serif;
    display: block;
  }
  .hidden {
    display: none;
  }
  #splashScreen, #startScreen {
    text-align: center;
    margin-top: 60px;
  }
  #splashScreen button, #startScreen button {
    font-size: 16px;
    padding: 20px 30px;
    margin: 10px;
  }
  .mapRow {
    border-bottom: 1px solid white;
    padding: 10px 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  #soundspaceLinks {
    border: 1px solid white;
    padding: 12px;
    margin: 12px 0;
  }
  #soundspaceLinks a {
    display: block;
    padding: 3px 0;
  }
  #previewArea {
    margin-top: 15px;
  }
  .colorsetBlock {
    border-bottom: 1px solid white;
    padding: 10px 0;
  }
  .colorGrid {
    display: grid;
    width: 140px;
    height: 140px;
    border: 2px solid white;
    border-radius: 16px;
    overflow: hidden;
    margin: 10px 0;
  }
  .colorGrid div {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<audio id="bgMusic" src="https://raw.githubusercontent.com/supasolid/ssss/main/ssss.mp3" loop></audio>
<button id="muteBtn" onclick="toggleMute()">Mute</button>

<div id="splashScreen">
  <h1>Solid's Library</h1>
  <button onclick="showPicker()">View</button>
</div>

<div id="startScreen" class="hidden">
  <h1>Library</h1>
  <button onclick="openGame('rhythia')">Rhythia (.sspm)</button>
  <button onclick="openGame('soundspace')">Sound Space Maps</button>
  <button onclick="openGame('colorsets')">Colorsets (.txt)</button>
  <button onclick="openGame('settings')">Settings (.settings.json)</button>
</div>

<div id="libraryScreen" class="hidden">
  <button onclick="goBack()">Back</button>
  <h1 id="gameTitle">Maps</h1>
  <p id="stats"></p>

  <input type="text" id="searchBox" class="hidden" placeholder="Search maps..." oninput="renderMaps()">

  <div id="soundspaceLinks" class="hidden">
    <p>More Sound Space customs:</p>
    <a href="https://faworee.com/soundspacecustoms/customs" target="_blank" rel="noopener">faworee.com/soundspacecustoms</a>
    <a href="https://scienceofgoodbye.com/maps" target="_blank" rel="noopener">scienceofgoodbye.com/maps</a>
    <a href="https://wmw-frog-enjoyer.github.io/ss-hub/sspm-archive/" target="_blank" rel="noopener">ss-hub sspm archive</a>
  </div>

  <button id="downloadAllBtn" onclick="downloadAll(this)">Download All</button>
  <button id="previewBtn" class="hidden" onclick="showColorsetPicker()">Preview a Colorset</button>
  <select id="colorsetSelect" class="hidden" onchange="previewSelectedColorset()">
    <option value="">-- choose a colorset --</option>
  </select>

  <div id="previewArea" class="hidden"></div>

  <div id="mapList"></div>
</div>

<script>
var GAMES = {
  rhythia: { name: "Rhythia Maps", ext: ".sspm", repo: "supasolid/rhythia-maps", itemName: "maps" },
  soundspace: { name: "Sound Space Maps", ext: ".txt", repo: "supasolid/sound-space-customs", itemName: "maps" },
  colorsets: { name: "Colorsets", ext: ".txt", repo: "supasolid/rhythia-colorsets", itemName: "colorsets" },
  settings: { name: "Settings", ext: ".settings.json", repo: "supasolid/rhythia-settings", itemName: "settings" }
};

var currentGame = null;
var maps = []; // list of {id, title, fileName, fileSize, downloadUrl}

function showPicker() {
  document.getElementById("splashScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  var music = document.getElementById("bgMusic");
  music.volume = 0.01;
  music.play();
}

function toggleMute() {
  var music = document.getElementById("bgMusic");
  music.muted = !music.muted;
  document.getElementById("muteBtn").textContent = music.muted ? "Unmute" : "Mute";
}

function openGame(game) {
  currentGame = game;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("libraryScreen").classList.remove("hidden");
  document.getElementById("gameTitle").textContent = GAMES[game].name;
  document.getElementById("soundspaceLinks").classList.toggle("hidden", game !== "soundspace");
  document.getElementById("previewBtn").classList.toggle("hidden", game !== "colorsets");
  document.getElementById("downloadAllBtn").classList.toggle("hidden", game === "soundspace");
  document.getElementById("searchBox").classList.toggle("hidden", game !== "rhythia" && game !== "soundspace");
  document.getElementById("searchBox").value = "";
  closePreview();
  loadMaps();
}

function goBack() {
  currentGame = null;
  document.getElementById("libraryScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  closePreview();
}

async function loadMaps() {
  var repo = GAMES[currentGame].repo;
  var ext = GAMES[currentGame].ext;
  document.getElementById("mapList").innerHTML = "<p>Loading...</p>";
  document.getElementById("stats").textContent = "";
  try {
    var res = await fetch("https://api.github.com/repos/" + repo + "/contents/");
    var data = await res.json();
    if (!Array.isArray(data)) {
      throw new Error(data.message || "GitHub API error");
    }
    maps = [];
    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      if (item.type === "file" && item.name.toLowerCase().endsWith(ext)) {
        maps.push({
          id: item.sha,
          title: item.name.slice(0, -ext.length),
          fileName: item.name,
          fileSize: item.size,
          downloadUrl: item.download_url
        });
      }
    }
  } catch (e) {
    maps = [];
    alert("Could not load files from GitHub: " + e.message);
  }
  renderMaps();
}

function renderMaps() {
  var list = document.getElementById("mapList");
  list.innerHTML = "";

  var searchBox = document.getElementById("searchBox");
  var filterText = searchBox.classList.contains("hidden") ? "" : searchBox.value.trim().toLowerCase();
  var shown = maps.filter(function (m) {
    return m.title.toLowerCase().indexOf(filterText) !== -1;
  });

  document.getElementById("stats").textContent = shown.length + " files";

  if (shown.length === 0) {
    list.innerHTML = "<p>No files found.</p>";
    return;
  }

  for (var i = 0; i < shown.length; i++) {
    var m = shown[i];
    var row = document.createElement("div");
    row.className = "mapRow";
    var actionButton = currentGame === "soundspace"
      ? "<button onclick=\"copyLink('" + m.id + "')\">Copy Link</button>"
      : "<button onclick=\"downloadOne('" + m.id + "', this)\">Download</button>";
    row.innerHTML = "<span>" + escapeText(m.title) + "</span>" + actionButton;
    list.appendChild(row);
  }
}

function copyLink(id) {
  var m = findMap(id);
  if (!m) return;
  navigator.clipboard.writeText(m.downloadUrl).then(function () {
    alert("Link copied!");
  }, function () {
    alert("Could not copy the link.");
  });
}

function escapeText(s) {
  var div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

function findMap(id) {
  for (var i = 0; i < maps.length; i++) {
    if (maps[i].id === id) return maps[i];
  }
  return null;
}

async function downloadOne(id, btn) {
  var m = findMap(id);
  if (!m) return;
  var oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Downloading...";
  try {
    var res = await fetch(m.downloadUrl);
    var blob = await res.blob();
    saveBlob(blob, m.fileName);
  } catch (e) {
    alert("Could not download this file.");
  }
  btn.disabled = false;
  btn.textContent = oldText;
}

function saveBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function downloadAll(btn) {
  var ids = maps.map(function (m) {
    return m.id;
  });
  var oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Zipping...";
  await downloadZip(ids);
  btn.disabled = false;
  btn.textContent = oldText;
}

async function downloadZip(ids) {
  if (ids.length === 0) {
    alert("No files to download");
    return;
  }
  try {
    var zip = new JSZip();
    for (var i = 0; i < ids.length; i++) {
      var m = findMap(ids[i]);
      if (!m) continue;
      var res = await fetch(m.downloadUrl);
      var buffer = await res.arrayBuffer();
      zip.file(m.fileName, buffer);
    }
    var blob = await zip.generateAsync({ type: "blob" });
    saveBlob(blob, currentGame + "-files.zip");
  } catch (e) {
    alert("Could not create the zip file.");
  }
}

function parseColorsFromText(text) {
  var colors = [];
  var lines = text.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line === "") continue;

    var hexMatch = line.match(/^#?([0-9a-fA-F]{6})$/);
    if (hexMatch) {
      colors.push("#" + hexMatch[1]);
      continue;
    }

    var rgbMatch = line.match(/^(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/);
    if (rgbMatch) {
      colors.push("rgb(" + rgbMatch[1] + "," + rgbMatch[2] + "," + rgbMatch[3] + ")");
    }
  }
  return colors;
}

function showColorsetPicker() {
  if (maps.length === 0) {
    alert("No colorsets to preview yet.");
    return;
  }

  var select = document.getElementById("colorsetSelect");
  select.innerHTML = "<option value=''>-- choose a colorset --</option>";
  for (var i = 0; i < maps.length; i++) {
    var m = maps[i];
    var opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.title;
    select.appendChild(opt);
  }
  select.classList.remove("hidden");

  var area = document.getElementById("previewArea");
  area.classList.add("hidden");
  area.innerHTML = "";
}

async function previewSelectedColorset() {
  var id = document.getElementById("colorsetSelect").value;
  var area = document.getElementById("previewArea");

  if (!id) {
    area.classList.add("hidden");
    area.innerHTML = "";
    return;
  }

  var m = findMap(id);
  if (!m) return;

  area.classList.remove("hidden");
  area.innerHTML = "<p>Loading preview...</p>";

  var html = "<div class='colorsetBlock'><h3>" + escapeText(m.title) + "</h3>";
  try {
    var res = await fetch(m.downloadUrl);
    var text = await res.text();
    var colors = parseColorsFromText(text);
    if (colors.length === 0) {
      html += "<p>No colors found in this file.</p>";
    } else {
      var cols = Math.ceil(Math.sqrt(colors.length));
      var rows = Math.ceil(colors.length / cols);
      html += "<div class='colorGrid' style='grid-template-columns: repeat(" + cols + ", 1fr); grid-template-rows: repeat(" + rows + ", 1fr);'>";
      for (var c = 0; c < rows * cols; c++) {
        var color = colors[c] || colors[colors.length - 1];
        html += "<div style='background:" + color + "'></div>";
      }
      html += "</div>";
    }
  } catch (e) {
    html += "<p>Could not load a preview for this file.</p>";
  }
  html += "<button onclick=\"downloadOne('" + m.id + "', this)\">Download</button></div>";
  area.innerHTML = html;
}

function closePreview() {
  var area = document.getElementById("previewArea");
  area.classList.add("hidden");
  area.innerHTML = "";

  var select = document.getElementById("colorsetSelect");
  select.classList.add("hidden");
  select.innerHTML = "<option value=''>-- choose a colorset --</option>";
}
</script>
</body>
</html>
